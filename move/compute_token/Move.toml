[package]
name = "compute_token"
edition = "2024.beta"

# COMPUTE: the marketplace's fungible "compute-unit" token. Providers sell it on a
# DeepBook pool to advertise the rate at which they'll dock; the control plane reads
# that pool's price to quote jobs. Carries no job/molecule data -- it's a generic unit,
# so nothing identifying ever touches the public order book (per the on-chain rule).
# Framework injected by the matching `sui` toolchain, like the escrow package.

[addresses]
compute_token = "0x0"
